# nginx config for the RELEASE-PARITY profile (./maintainerd up --profile=auth-release).
#
# Unlike local.conf (which fronts the three hot-reload dev containers), this
# points every host at the SINGLE all-in-one release image
# (maintainerd-auth-release). It exists to test the compiled image the way it
# runs in production: an edge terminates TLS and forwards plain HTTP with
# X-Forwarded-Proto, and the Go process inside the image serves the SPAs AND
# routes their APIs same-origin itself. So the console/identity hosts here just
# proxy EVERYTHING to the container's SPA port — the app does the /api,
# /public-api, /.well-known, /config.js and static routing internally. That is
# exactly what the refactor moved out of nginx and into the binary, so this
# profile verifies it end-to-end.

resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate /etc/nginx/certs/auth.maintainerd.local.crt;
ssl_certificate_key /etc/nginx/certs/auth.maintainerd.local.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:LocalTLS:10m;
ssl_session_timeout 1h;

# Plain HTTP exists only to move local browser traffic onto HTTPS.
server {
    listen 80 default_server;
    server_name *.auth.maintainerd.local *.identity.auth.maintainerd.local *.console.auth.maintainerd.local;
    return 308 https://$host$request_uri;
}

# ── Control plane API (direct) — console-api.auth.maintainerd.local → :8080 ──
server {
    listen 443 ssl;
    server_name console-api.auth.maintainerd.local;

    location = / {
        return 200 '{"message":"Auth Control Plane API","status":"running","api_path":"/api/v1/"}';
        add_header Content-Type application/json;
    }

    location /api/ {
        set $auth_control http://maintainerd-auth-release:8080;
        proxy_pass $auth_control;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Data plane API (direct, the OIDC issuer) — identity-api.auth… → :8081 ─────
server {
    listen 443 ssl;
    server_name identity-api.auth.maintainerd.local;

    location = / {
        return 200 '{"message":"Auth Data Plane API","status":"running","api_path":"/api/v1/"}';
        add_header Content-Type application/json;
    }

    # This host IS the issuer, so discovery + JWKS must resolve here.
    location /.well-known/ {
        set $auth_data http://maintainerd-auth-release:8081;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $auth_data http://maintainerd-auth-release:8081;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Admin console — console.auth.maintainerd.local → the image's :3000 ───────
# Everything (SPA, /api → control, /public-api → data, /config.js) is served by
# the container's console port; the Go app routes it all same-origin.
server {
    listen 443 ssl;
    server_name console.auth.maintainerd.local *.console.auth.maintainerd.local;

    location / {
        set $console http://maintainerd-auth-release:3000;
        proxy_pass $console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Hosted identity — identity.auth.maintainerd.local → the image's :3001 ────
server {
    listen 443 ssl;
    server_name identity.auth.maintainerd.local *.identity.auth.maintainerd.local;

    location / {
        set $identity http://maintainerd-auth-release:3001;
        proxy_pass $identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── RabbitMQ management (runs in this profile too) ───────────────────────────
server {
    listen 443 ssl;
    server_name rabbitmq.auth.maintainerd.local;

    location / {
        set $rabbitmq_management http://rabbitmq:15672;
        proxy_pass $rabbitmq_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
