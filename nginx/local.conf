# Docker's embedded DNS keeps upstream addresses fresh across hot-reload
# container recreations. Variables defer resolution until request time.
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate /etc/nginx/certs/auth.maintainerd.local.crt;
ssl_certificate_key /etc/nginx/certs/auth.maintainerd.local.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:LocalTLS:10m;
ssl_session_timeout 1h;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ──────────────────────────────────────────────────────────────────────────────
# Host scheme (mirrors the production {tenant}.{surface}.auth.maintainerd.com plan)
#
#   identity.auth.maintainerd.local            identity UI    — system tenant
#   {tenant}.identity.auth.maintainerd.local   identity UI    — regular tenant
#   console.auth.maintainerd.local             auth console   — system tenant
#   {tenant}.console.auth.maintainerd.local    auth console   — regular tenant
#   identity-api.auth.maintainerd.local        data plane API   (auth:8081)
#   console-api.auth.maintainerd.local         control plane API (auth:8080)
#
# The tenant-less hosts resolve to the system tenant. nginx matches exact
# server_names before wildcards, and prefers the longest wildcard — so the fixed
# hosts (identity-api, console-api, console) win over broader wildcards, and
# {tenant}.identity.auth / {tenant}.console.auth each resolve to their own block.
# ──────────────────────────────────────────────────────────────────────────────

# Plain HTTP exists only to move local browser traffic onto HTTPS.
server {
    listen 80 default_server;
    server_name *.auth.maintainerd.local *.identity.auth.maintainerd.local *.console.auth.maintainerd.local;
    return 308 https://$host$request_uri;
}

# ──────────────────────────────────────────────────────────────────────────────
# maintainerd — Control plane API (port 8080, tenant/client management)
#   Host: console-api.auth.maintainerd.local
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name console-api.auth.maintainerd.local;

    location = / {
        return 200 '{"message":"Auth Control Plane API","status":"running","api_path":"/api/v1/"}';
        add_header Content-Type application/json;
    }

    location /api/ {
        set $auth_control http://maintainerd-auth:8080;
        proxy_pass $auth_control;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# maintainerd — Data plane API (port 8081, OAuth2/OIDC/public REST)
#   Host: identity-api.auth.maintainerd.local
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name identity-api.auth.maintainerd.local;

    location = / {
        return 200 '{"message":"Auth Data Plane API","status":"running","api_path":"/api/v1/"}';
        add_header Content-Type application/json;
    }

    # This host IS the `issuer` the discovery document advertises, so the
    # well-known documents MUST be served here. A relying party bootstraps by
    # fetching {issuer}/.well-known/openid-configuration and then the jwks_uri it
    # names — both of which point at this origin. With only /api/ proxied, both
    # returned 404 and no standards-compliant third-party client could discover
    # this authorization server or validate a single signature, even though the
    # backend served them correctly on :8081.
    location /.well-known/ {
        set $auth_data http://maintainerd-auth:8081;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    location /api/ {
        set $auth_data http://maintainerd-auth:8081;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# maintainerd — Auth console frontend (dev server, port 3000 in container)
#   Hosts: console.auth.maintainerd.local            (system tenant)
#          {tenant}.console.auth.maintainerd.local   (regular tenant)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name console.auth.maintainerd.local *.console.auth.maintainerd.local;

    # The console talks to BOTH planes, same-origin (no Vite proxy hop):
    #   /api/         → control plane (:8080) — tenant/client admin data
    #   /public-api/  → data plane   (:8081) — tenant bootstrap + OAuth (token
    #                   exchange, console client lookup)
    # $host is forwarded so the backend can resolve the tenant from the console
    # subdomain.
    location /api/ {
        set $auth_control http://maintainerd-auth:8080;
        proxy_pass $auth_control;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    # Strip the /public-api prefix so the backend sees its normal /api/v1/... path.
    location /public-api/ {
        set $auth_data http://maintainerd-auth:8081;
        rewrite ^/public-api/(.*)$ /$1 break;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    location / {
        # Admin console SPA is served by the all-in-one image on :3000.
        set $console http://maintainerd-auth:3000;
        proxy_pass $console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# maintainerd — Identity frontend (dev server, port 3000 in container)
#   Hosts: identity.auth.maintainerd.local             (system tenant)
#          {tenant}.identity.auth.maintainerd.local    (regular tenant)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name identity.auth.maintainerd.local *.identity.auth.maintainerd.local;

    # The hosted identity UI is restricted to the data-plane API surface. The
    # original $host is forwarded so the backend can resolve the tenant from the
    # identity subdomain.
    location /api/ {
        set $auth_data http://maintainerd-auth:8081;
        proxy_pass $auth_data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    location / {
        # Hosted identity SPA is served by the all-in-one image on :3001.
        set $identity http://maintainerd-auth:3001;
        proxy_pass $identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# Operational web UIs
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name rabbitmq.auth.maintainerd.local;

    location / {
        set $rabbitmq_management http://rabbitmq:15672;
        proxy_pass $rabbitmq_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name prometheus.auth.maintainerd.local;

    location / {
        set $prometheus http://prometheus:9090;
        proxy_pass $prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name grafana.auth.maintainerd.local;

    location / {
        set $grafana http://grafana:3000;
