# =============================================================================
# maintainerd — Development Environment
# LOCAL DEVELOPMENT ONLY — not production-hardened.
# =============================================================================
# Profiles:
#   auth    All auth services (backend + frontends + databases + nginx)
#   auth-observed  Auth + observability (Prometheus + Grafana + SigNoz)
#   all            Everything (currently equivalent to auth-observed)
#
# Usage:
#   ./maintainerd up --profile=auth -d
#   ./maintainerd up --profile=auth-observed -d
#   ./maintainerd down
# =============================================================================

# Pull in SigNoz (OTLP collector, ClickHouse, UI). SigNoz listens on host ports
# 4317/4318 (gRPC/HTTP); its UI is at http://localhost:8080.
# Vendored from github.com/SigNoz/signoz (deploy/) at v0.128.0.
include:
  - deploy/signoz/docker/docker-compose.yaml

services:
  # The included SigNoz services are unprofiled upstream. Assign them here so
  # auth stays lightweight while auth-observed and all remain complete.
  init-clickhouse:
    profiles: ["auth-observed", "all"]

  zookeeper-1:
    profiles: ["auth-observed", "all"]

  clickhouse:
    profiles: ["auth-observed", "all"]

  signoz:
    profiles: ["auth-observed", "all"]
    ports: !reset []
    networks:
      - default
      - signoz-net

  otel-collector:
    profiles: ["auth-observed", "all"]
    networks:
      - default
      - signoz-net

  signoz-telemetrystore-migrator:
    profiles: ["auth-observed", "all"]

  # ── Infrastructure (shared across profiles) ─────────────────────────────────

  postgres-db:
    image: postgres:17
    container_name: postgres-db
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: maintainerd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "devuser", "-d", "maintainerd"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-db:
    image: redis:7
    container_name: redis-db
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "Pass123"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Pass123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: Pass123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────

  maintainerd-auth:
    # DEV MODE — Go backend with Air hot-reload, source bind-mounted from the
    # consolidated repo. The console + identity SPAs run as their own hot-reload
    # vite dev servers below (from web/console, web/identity). For the single
    # compiled all-in-one image instead, see maintainerd-auth/Dockerfile (that's
    # what ships on release; run it via maintainerd-auth/docker-compose.yml).
    build:
      context: ../maintainerd-auth
      dockerfile: Dockerfile.local
    image: m9d-auth-dev
    container_name: m9d-auth-dev
    profiles: ["auth", "auth-observed", "all"]
    # gRPC (mTLS) is exposed for host tooling such as grpcurl. HTTP APIs stay
    # behind nginx; only the gRPC port is published directly.
    ports:
      - "50051:50051"
    volumes:
      # Source bind mount for hot-reload; the backend reads ../maintainerd-auth/.env
      # (generated by ./maintainerd setup) from the mounted working dir.
      - ../maintainerd-auth:/usr/src/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # gRPC mTLS material (server cert/key + client CA). Read-only; generated by
      # ./maintainerd setup. Paths match GRPC_*_FILE in the auth .env.
      - ./.certs/grpc:/etc/maintainerd/grpc-certs:ro
    environment:
      - ENV=local
      - CGO_ENABLED=0
      # The launcher enables OTLP only when an observability profile is active.
      - OTEL_ENABLED=${MAINTAINERD_OTEL_ENABLED:-false}
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # ── nginx (API gateway) ─────────────────────────────────────────────────────

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - console-api.auth.maintainerd.local
          - identity-api.auth.maintainerd.local
          - console.auth.maintainerd.local
          - identity.auth.maintainerd.local
          - rabbitmq.auth.maintainerd.local
          - prometheus.auth.maintainerd.local
          - grafana.auth.maintainerd.local
          - signoz.auth.maintainerd.local
    depends_on:
      maintainerd-auth:
        condition: service_started
      maintainerd-auth-console:
        condition: service_healthy
      maintainerd-auth-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontends (dev servers, hot-reload from the monorepo subdirs) ────────────

  maintainerd-auth-console:
    build:
      context: ../maintainerd-auth/web/console
      dockerfile: Dockerfile.local
    image: m9d-console-dev
    container_name: m9d-console-dev
    profiles: ["auth", "auth-observed", "all"]
    volumes:
      - ../maintainerd-auth/web/console:/app
      - console-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Polling is reliable for bind mounts and avoids host inotify exhaustion.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - maintainerd-auth
    init: true
    restart: unless-stopped

  maintainerd-auth-identity:
    build:
      context: ../maintainerd-auth/web/identity
      dockerfile: Dockerfile.local
    image: m9d-identity-dev
    container_name: m9d-identity-dev
    profiles: ["auth", "auth-observed", "all"]
    volumes:
      - ../maintainerd-auth/web/identity:/app
      - identity-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - maintainerd-auth
    init: true
    restart: unless-stopped

  # ── Observability (auth-observed and all profiles) ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["auth-observed", "all"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    profiles: ["auth-observed", "all"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_ROOT_URL=https://grafana.auth.maintainerd.local
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  go-mod-cache:
  go-build-cache:
  console-node-modules:
  identity-node-modules:
  prometheus-data:
  grafana-data:

networks:
  default:
    driver: bridge
  signoz-net:
    name: signoz-net
