# =============================================================================
# maintainerd — Development Environment
# LOCAL DEVELOPMENT ONLY — not production-hardened.
# =============================================================================
# Profiles:
#   auth           DEV: backend + both frontends in hot-reload (Air + vite) +
#                  databases + nginx. This is what you use while coding.
#   auth-release   RELEASE PARITY: the SINGLE all-in-one image (backend + both
#                  SPAs embedded) built locally from maintainerd-auth/Dockerfile,
#                  behind nginx as the TLS edge, on the same databases + URLs.
#                  Use it to confirm the compiled image works before tagging a
#                  release. No hot reload — rebuild to pick up code changes.
#   auth-observed  Auth (dev) + observability (Prometheus + Grafana + SigNoz)
#   maintainerd    The maintainerd core stack (Core + Agent + Secret), no auth
#                  (the docker runtime driver is compiled into the Agent)
#   all            Everything EXCEPT observability (auth + maintainerd core stack)
#   all-observed   Everything INCLUDING observability (all + Prometheus/Grafana/SigNoz)
#
# Usage:
#   ./maintainerd up --profile=auth -d           # daily development
#   ./maintainerd up --profile=auth-release -d   # test the release image locally
#   ./maintainerd up --profile=auth-observed -d
#   ./maintainerd up --profile=maintainerd -d    # core stack only
#   ./maintainerd up --profile=all -d            # auth + core, no observability
#   ./maintainerd up --profile=all-observed -d   # everything + observability
#   ./maintainerd down
# =============================================================================

# Pull in SigNoz (OTLP collector, ClickHouse, UI). SigNoz listens on host ports
# 4317/4318 (gRPC/HTTP); its UI is at http://localhost:8080.
# Vendored from github.com/SigNoz/signoz (deploy/) at v0.128.0.
include:
  - deploy/signoz/docker/docker-compose.yaml

services:
  # The included SigNoz services are unprofiled upstream. Assign them here so
  # they only start under the observability profiles (auth-observed, all-observed)
  # — the plain `auth` and `all` profiles stay observability-free.
  init-clickhouse:
    profiles: ["auth-observed", "all-observed"]

  zookeeper-1:
    profiles: ["auth-observed", "all-observed"]

  clickhouse:
    profiles: ["auth-observed", "all-observed"]

  signoz:
    profiles: ["auth-observed", "all-observed"]
    ports: !reset []
    networks:
      - default
      - signoz-net

  otel-collector:
    profiles: ["auth-observed", "all-observed"]
    networks:
      - default
      - signoz-net

  signoz-telemetrystore-migrator:
    profiles: ["auth-observed", "all-observed"]

  # ── Infrastructure (shared across profiles) ─────────────────────────────────

  postgres-db:
    image: postgres:17
    container_name: postgres-db
    profiles: ["auth", "auth-release", "auth-observed", "all", "all-observed"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: maintainerd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "devuser", "-d", "maintainerd"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-db:
    image: redis:7
    container_name: redis-db
    profiles: ["auth", "auth-release", "auth-observed", "all", "all-observed"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "Pass123"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Pass123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    profiles: ["auth", "auth-release", "auth-observed", "all", "all-observed"]
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: Pass123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────

  maintainerd-auth:
    # DEV MODE — Go backend with Air hot-reload, source bind-mounted from the
    # consolidated repo. The console + identity SPAs run as their own hot-reload
    # vite dev servers below (from web/console, web/identity). To instead run the
    # single compiled all-in-one image (backend + both SPAs embedded), use the
    # `auth-release` profile — see the maintainerd-auth-release service below.
    build:
      context: ../maintainerd-auth
      dockerfile: Dockerfile.local
    image: maintainerd-auth-dev
    container_name: maintainerd-auth-dev
    profiles: ["auth", "auth-observed", "all", "all-observed"]
    # gRPC (mTLS) is exposed for host tooling such as grpcurl. HTTP APIs stay
    # behind nginx; only the gRPC port is published directly.
    ports:
      - "50051:50051"
    volumes:
      # Source bind mount for hot-reload; the backend reads ../maintainerd-auth/.env
      # (generated by ./maintainerd setup) from the mounted working dir.
      - ../maintainerd-auth:/usr/src/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # gRPC mTLS material (server cert/key + client CA). Read-only; generated by
      # ./maintainerd setup. Paths match GRPC_*_FILE in the auth .env.
      - ./.certs/grpc:/etc/maintainerd/grpc-certs:ro
    environment:
      - ENV=local
      - CGO_ENABLED=0
      # Air rebuilds in-container; let Go fetch the toolchain auth's go.mod pins
      # (the dev base image ships an older patch, and GOTOOLCHAIN=local would make
      # the build fail — which silently leaves the whole auth backend down).
      - GOTOOLCHAIN=auto
      # The launcher enables OTLP only when an observability profile is active.
      - OTEL_ENABLED=${MAINTAINERD_OTEL_ENABLED:-false}
      # Setup bootstrap: EMPTY under the auth-only profiles so the console REST
      # setup wizard is the bootstrap path (no orchestrator present). Under the
      # all / all-observed profiles the launcher sets these so Core drives Auth's
      # gRPC SetupService instead (which closes the REST wizard — expected, since
      # Core now owns setup). godotenv won't clobber a set env var.
      - SETUP_BOOTSTRAP_TOKEN=${MAINTAINERD_AUTH_SETUP_TOKEN:-}
      - GRPC_ENABLED=${MAINTAINERD_AUTH_GRPC_ENABLED:-}
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # ── nginx (API gateway) ─────────────────────────────────────────────────────

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    profiles: ["auth", "auth-observed", "all", "all-observed"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - console-api.auth.maintainerd.local
          - identity-api.auth.maintainerd.local
          - console.auth.maintainerd.local
          - identity.auth.maintainerd.local
          - rabbitmq.auth.maintainerd.local
          - prometheus.auth.maintainerd.local
          - grafana.auth.maintainerd.local
          - signoz.auth.maintainerd.local
          # Core console (maintainerd's main dashboard) — served under the
          # all / all-observed profiles alongside the core stack.
          - console.maintainerd.local
          - console-api.maintainerd.local
          # Secret's own console (it is adoptable alone, so it has one).
          - console.secret.maintainerd.local
          - console-api.secret.maintainerd.local
    depends_on:
      maintainerd-auth:
        condition: service_started
      maintainerd-auth-console:
        condition: service_healthy
      maintainerd-auth-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontends (dev servers, hot-reload from the monorepo subdirs) ────────────

  maintainerd-auth-console:
    build:
      context: ../maintainerd-auth/web/console
      dockerfile: Dockerfile.local
    image: maintainerd-console-dev
    container_name: maintainerd-console-dev
    profiles: ["auth", "auth-observed", "all", "all-observed"]
    volumes:
      - ../maintainerd-auth/web/console:/app
      - console-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Polling is reliable for bind mounts and avoids host inotify exhaustion.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - maintainerd-auth
    init: true
    restart: unless-stopped

  maintainerd-auth-identity:
    build:
      context: ../maintainerd-auth/web/identity
      dockerfile: Dockerfile.local
    image: maintainerd-identity-dev
    container_name: maintainerd-identity-dev
    profiles: ["auth", "auth-observed", "all", "all-observed"]
    volumes:
      - ../maintainerd-auth/web/identity:/app
      - identity-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - maintainerd-auth
    init: true
    restart: unless-stopped

  # ── Core console (maintainerd's main dashboard) ──────────────────────────────
  # The control-plane UI. Vite dev server (hot reload) reached through nginx at
  # https://console.maintainerd.local. Talks to the core REST API same-origin
  # (nginx routes /api/ → maintainerd-core:8080). Runs with the core stack under the
  # all / all-observed profiles.
  maintainerd-core-console:
    build:
      context: ../maintainerd/web/console
      dockerfile: Dockerfile.local
    image: maintainerd-core-console-dev
    container_name: maintainerd-core-console-dev
    profiles: ["all", "all-observed"]
    volumes:
      - ../maintainerd/web/console:/app
      - core-console-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Polling is reliable for bind mounts and avoids host inotify exhaustion.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      # --- sign-in wiring -------------------------------------------------
      # The VITE_* spellings, not the service's own AUTH_ISSUER/CORE_CONSOLE_*
      # names. Both are read (runtime window.__ENV__ first, then build-time
      # import.meta.env), and only the VITE_ prefix crosses from a container env
      # var into the bundle. It also lets ISSUER_URL differ from the service's
      # AUTH_ISSUER, which it must: the SPA appends /authorize and /end-session,
      # and those are pages on the identity APP, while AUTH_ISSUER is the API
      # origin that appears in the `iss` claim. Same authorization server, two
      # different hostnames.
      - VITE_OAUTH_ISSUER_URL=https://identity.auth.maintainerd.local
      - VITE_OAUTH_TOKEN_URL=https://identity-api.auth.maintainerd.local/api/v1/oauth/token
      - VITE_OAUTH_AUDIENCE=https://core.maintainerd.local
      # EMPTY BY DEFAULT AND THAT IS THE HONEST VALUE. Auth generates this client
      # id during setup, so it differs per install and cannot be committed here.
      # Empty means the console reports "cannot obtain a token" instead of sending
      # the browser to /authorize for a client that may not exist. Read the real id
      # and export this before `up` — README §"Identity in the local stack".
      - VITE_OAUTH_CLIENT_ID=${MAINTAINERD_CORE_CONSOLE_CLIENT_ID:-}
    depends_on:
      - maintainerd-core
    init: true
    restart: unless-stopped

  # ── Release parity (auth-release profile) ────────────────────────────────────
  # The SINGLE all-in-one image, built locally from the SAME Dockerfile that
  # ships on release (SPAs embedded via go:embed). No source bind mount and no
  # hot reload: it is the compiled artifact. Rebuild to pick up code changes:
  #   ./maintainerd up --profile=auth-release -d --build
  maintainerd-auth-release:
    build:
      context: ../maintainerd-auth
      dockerfile: Dockerfile
      args:
        VERSION: local-release
    image: maintainerd-auth-release
    container_name: maintainerd-auth-release
    profiles: ["auth-release"]
    ports:
      # gRPC (mTLS) for host tooling such as grpcurl, matching the dev backend.
      - "50051:50051"
    volumes:
      # The image reads its config via godotenv from /.env at startup — the same
      # .env `./maintainerd setup` generates for dev (real newlines for the JWT
      # PEM, which env_file cannot preserve). Read-only; the image never writes it.
      - ../maintainerd-auth/.env:/.env:ro
      # gRPC mTLS material (server cert/key + client CA), same as the dev backend.
      - ./.certs/grpc:/etc/maintainerd/grpc-certs:ro
    environment:
      # Enable OTLP only when an observability profile is active (off here).
      - OTEL_ENABLED=${MAINTAINERD_OTEL_ENABLED:-false}
      # Empty on purpose — same reason as the dev backend above: no orchestrator
      # locally, so the console REST setup wizard is the bootstrap path. A set
      # token would 403 it ("Setup is orchestrator-managed").
      - SETUP_BOOTSTRAP_TOKEN=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # TLS edge for the release image. Same certs + hostnames as the dev `nginx`
  # service, but points every host at the single release container (see
  # nginx/local-release.conf). Runs only in auth-release, so it never contends
  # with the dev `nginx` for :80/:443.
  nginx-release:
    image: nginx:latest
    container_name: nginx-release
    profiles: ["auth-release"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local-release.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - console-api.auth.maintainerd.local
          - identity-api.auth.maintainerd.local
          - console.auth.maintainerd.local
          - identity.auth.maintainerd.local
          - rabbitmq.auth.maintainerd.local
    depends_on:
      maintainerd-auth-release:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Observability (auth-observed and all profiles) ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["auth-observed", "all-observed"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    profiles: ["auth-observed", "all-observed"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_ROOT_URL=https://grafana.auth.maintainerd.local
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ===========================================================================
  # maintainerd core stack — Core + Agent (docker driver inside) + Secret + Postgres.
  # Profiles: `maintainerd` (just this stack) and `all` (everything).
  #   ./maintainerd up --profile=maintainerd -d
  # Built from the parent context via build/Dockerfile (+ build/Dockerfile.dockerignore).
  # Core publishes 9080 (REST) / 9081 (gRPC) — 8080 is taken by SigNoz.
  # ===========================================================================
  maintainerd-core-db:
    image: postgres:16-alpine
    profiles: ["maintainerd", "all", "all-observed"]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: corepass
      POSTGRES_DB: core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Secret's own Postgres. It is a real vault now (tenant → project →
  # environment → folder → secret → immutable versions), so it needs a database
  # of its own rather than sharing core's.
  maintainerd-secret-db:
    image: postgres:16-alpine
    profiles: ["maintainerd", "all", "all-observed"]
    environment:
      POSTGRES_USER: secret
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secret -d secret"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  maintainerd-secret:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd-secret
        CMD_PATH: cmd/secretd
    profiles: ["maintainerd", "all", "all-observed"]
    depends_on:
      maintainerd-secret-db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: maintainerd-secret-db
      DB_PORT: "5432"
      DB_USER: secret
      DB_PASSWORD: secretpass
      DB_NAME: secret
      DB_SSLMODE: disable
      # 64 hex characters = the 32-byte AES-256 KEK the envelope crypto requires.
      # A shorter value is refused at boot rather than silently padded, because a
      # weakened root key nobody notices is worse than a service that will not start.
      SECRET_ROOT_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SETUP_BOOTSTRAP_TOKEN: devtoken
      # STANDALONE even under the `all` profile, where Core is running. Core
      # provisions Secret's IAM records in Auth (its steward catalog carries the
      # twelve permissions), but nothing yet drives Secret's OWN gRPC
      # SetupService to create its tenant mirror and default project/environment
      # — that is the open "provider registration" item. In `core` mode Secret
      # closes its REST setup wizard from first boot, so flipping this now would
      # leave the instance with no bootstrap path at all. When Core starts
      # driving that surface, set MAINTAINERD_SECRET_MODE=core.
      MAINTAINERD_MODE: ${MAINTAINERD_SECRET_MODE:-standalone}
      GRPC_PORT: "9092"
      HTTP_PORT: "8092"
      # The bearer-token verifier. These three are all-or-nothing: a JWKS URL
      # without an issuer and audience check accepts any token Auth ever signed,
      # so the service refuses a partial set at boot.
      #
      # SET, NOT EMPTY. Leaving them empty is what put this service in
      # development-open mode — no bearer token required and every caller treated
      # as a blanket administrator, on a vault. `GET /api/v1/projects` answered 200
      # to an anonymous curl. The dev stack runs Auth, so there is no reason for
      # the guard to be open here.
      #
      # THE JWKS URL IS INTERNAL, THE OTHER TWO ARE PUBLIC — see the identical
      # comment on maintainerd-core below for why the two forms differ.
      #
      # Plaintext http on the JWKS hop is DEVELOPMENT ONLY: nginx is this stack's
      # TLS edge and this container carries no copy of the local CA, so the
      # in-network hop to Auth is unencrypted. Production must point this at the
      # https public JWKS URL (or terminate inside a mesh that provides mTLS).
      AUTH_JWKS_URL: "http://maintainerd-auth:8081/.well-known/jwks.json"
      AUTH_ISSUER: "https://identity-api.auth.maintainerd.local"
      # The `apis.identifier` Core registered for secret from its steward catalog
      # (SECRET_API_AUDIENCE). It is an identifier, not a URL — nothing fetches it.
      AUTH_AUDIENCE: "https://secret.maintainerd.local"
      # This service's OWN m2m client, for tokens it needs to call other services.
      # PRESENCE-CHECKED ONLY, and deliberately placeholders: nothing in this
      # service presents them today (there is no outbound token code yet), and the
      # real credential cannot be supplied here anyway — Core's steward mints
      # secret's keypair as private_key_jwt and writes the private key to its OWN
      # STEWARD_KEY_DIR, with no handoff to this container. Replace with the real
      # client id + SECRET_CLIENT_PRIVATE_KEY_FILE once that handoff exists.
      SECRET_CLIENT_ID: "dev-placeholder-secret-client"
      SECRET_CLIENT_SECRET: "dev-placeholder-not-a-real-credential"
      # The console's PUBLIC SPA client id. Also presence-checked only — the
      # service never uses it; the console reads its own copy (see the console
      # service below). No such client exists in Auth yet, so the value here is a
      # placeholder that keeps the boot check honest about what is missing rather
      # than a client id the browser would be sent to. See README §"Identity in
      # the local stack".
      SECRET_CONSOLE_CLIENT_ID: "dev-placeholder-secret-console-client"
    restart: unless-stopped

  # ── Secret console (maintainerd-secret's own dashboard) ─────────────────────
  # Secret is adoptable alone — an org can run just it plus Auth — so it ships a
  # console of its own rather than a page inside core's. Vite dev server (hot
  # reload) reached through nginx at https://console.secret.maintainerd.local,
  # which also routes /api/ → maintainerd-secret:8092 so the SPA talks to the API
  # same-origin.
  maintainerd-secret-console:
    build:
      context: ../maintainerd-secret/web/console
      dockerfile: Dockerfile.local
    image: maintainerd-secret-console-dev
    container_name: maintainerd-secret-console
    profiles: ["maintainerd", "all", "all-observed"]
    volumes:
      - ../maintainerd-secret/web/console:/app
      - secret-console-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Polling is reliable for bind mounts and avoids host inotify exhaustion.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      # --- sign-in wiring -------------------------------------------------
      # Same scheme and same issuer-vs-API-origin split as the core console above.
      - VITE_OAUTH_ISSUER_URL=https://identity.auth.maintainerd.local
      - VITE_OAUTH_TOKEN_URL=https://identity-api.auth.maintainerd.local/api/v1/oauth/token
      - VITE_OAUTH_AUDIENCE=https://secret.maintainerd.local
      # Empty because no SPA client for THIS console exists in Auth at all — Core's
      # setup registers one console client (its own) and the steward catalog has no
      # console-client kind. Until an operator creates it, empty is the only value
      # that is not a lie; the console shows its blocked banner and secret's API
      # answers 401. README §"Identity in the local stack" has the steps.
      - VITE_OAUTH_CLIENT_ID=${MAINTAINERD_SECRET_CONSOLE_CLIENT_ID:-}
    depends_on:
      - maintainerd-secret
    init: true
    restart: unless-stopped

  # NOTE: the former maintainerd-docker service is gone — the docker runtime driver is
  # compiled INTO the agent (maintainerd-agent internal/runtime/docker), so the
  # agent mounts the host socket directly. See plan/14-target-architecture.md.

  maintainerd-core:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd
        CMD_PATH: cmd/server
    profiles: ["maintainerd", "all", "all-observed"]
    # Dev-only: root so it can read the 0600 gRPC client key it presents to Auth.
    user: "0:0"
    depends_on:
      maintainerd-core-db:
        condition: service_healthy
      # service_started, NOT service_healthy, for auth and secret — deliberately.
      #
      # The three are meant to start TOGETHER: core configures auth first and
      # secret afterwards. Waiting for either to report healthy would serialise a
      # startup that is supposed to be concurrent, and would deadlock the case
      # where a dependency's own health depends on core having configured it.
      #
      # Core converges instead of waiting: internal/dependency retries until each
      # is reachable, and /readyz stays not-ready until they settle. "Not
      # listening yet" is the normal early state, not an error.
      #
      # required: false because auth is NOT in the `maintainerd` profile. Without
      # it, `--profile=maintainerd` failed to load at all — "depends on undefined
      # service maintainerd-auth" — since Compose resolves depends_on against the
      # services the selected profile actually activates. With it, the ordering
      # applies wherever auth is present and is skipped where it is not, which is
      # the same thing core's reconcile loop already tolerates at runtime.
      #
      # Note what the auth-free profile then means: core comes up with no reachable
      # auth, so in development its guard opens. That is the documented trade of
      # `--profile=maintainerd` (core stack only), not an accident.
      maintainerd-auth:
        condition: service_started
        required: false
      maintainerd-secret:
        condition: service_started
        required: false
    healthcheck:
      # /readyz, not /healthz: readiness is what carries the dependency state, so
      # `docker compose ps` reports honestly while core is still converging.
      #
      # The binary's own `readyz` subcommand, NOT wget: build/Dockerfile ships this
      # service from distroless/static, which has no wget, curl or shell. The old
      # wget probe never once succeeded — it failed with "executable not found",
      # which docker reports identically to a failing dependency, so core showed
      # (unhealthy) whatever its real state was. cmd/server/main.go exists for
      # exactly this and probes its own /readyz over loopback.
      test: ["CMD", "/app", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    environment:
      APP_ENV: development
      DB_HOST: maintainerd-core-db
      DB_PORT: "5432"
      DB_USER: core
      DB_PASSWORD: corepass
      DB_NAME: core
      DB_SSLMODE: disable
      APP_PUBLIC_HOSTNAME: http://localhost
      APP_PRIVATE_HOSTNAME: http://localhost
      HTTP_PORT: "8080"
      GRPC_PORT: "8081"
      # Setup orchestration — Core drives Auth's gRPC SetupService, provisions the
      # system tenant + admin, registers itself as the control service, persists
      # the credentials, and seeds its service registry. Only engaged under the
      # all / all-observed profiles (the launcher sets MAINTAINERD_SETUP_ENABLED),
      # where Auth is also running.
      SETUP_ENABLED: ${MAINTAINERD_SETUP_ENABLED:-false}
      # The setup surface is the one route that bypasses the bearer guard — it has
      # to, since it is what provisions the instance that would mint the token. It
      # carries its own gate instead, and with this unset the gate is OFF: an
      # anonymous `POST /api/v1/setup` answered 200. Enforcing the bearer guard
      # does nothing for this route, so it needs its own value. Matches the
      # devtoken convention used for the gRPC bootstrap tokens above.
      # Callers send it as the X-Setup-Token header; a core:admin bearer also works.
      CORE_SETUP_TOKEN: devtoken
      AUTH_SETUP_ADDR: "maintainerd-auth:50051"
      AUTH_SETUP_BOOTSTRAP_TOKEN: ${MAINTAINERD_AUTH_SETUP_TOKEN:-}
      # Auth's gRPC serves TLS with the local CA; present the client cert too so
      # this works whether or not Auth requires mTLS (control-plane mode).
      AUTH_SETUP_CA_FILE: /etc/maintainerd/grpc-certs/ca.crt
      AUTH_SETUP_CLIENT_CERT_FILE: /etc/maintainerd/grpc-certs/client.crt
      AUTH_SETUP_CLIENT_KEY_FILE: /etc/maintainerd/grpc-certs/client.key
      AUTH_SETUP_SERVER_NAME: maintainerd-auth
      # The system tenant + IAM admin to provision in Auth (dev defaults).
      SETUP_TENANT_NAME: maintainerd
      SETUP_TENANT_DISPLAY_NAME: Maintainerd
      SETUP_ADMIN_USERNAME: admin
      SETUP_ADMIN_FULLNAME: Maintainerd Admin
      SETUP_ADMIN_EMAIL: admin@maintainerd.local
      SETUP_ADMIN_PASSWORD: ${MAINTAINERD_ADMIN_PASSWORD:-Pass123!}
      # Core's console + service-registry wiring.
      CORE_CONSOLE_DOMAIN: console.maintainerd.local
      SECRET_ENDPOINT: "maintainerd-secret:9092"
      # --- auth + secret as hard dependencies -----------------------------
      # Outside development a missing one of these is a boot error naming them
      # all at once. APP_ENV=development downgrades that to a warning, so the
      # stack still comes up for someone working on a single service — but the
      # guards open and any provision needing secret material still fails closed.
      #
      # Set here so the dev stack exercises the REAL path rather than the
      # development relaxation.
      #
      # TWO FORMS ON PURPOSE — internal for what core DIALS, public for what core
      # COMPARES. It reads as an inconsistency and is not:
      #
      #   AUTH_JWKS_URL is FETCHED by this process (verifier + the /readyz probe),
      #   so it has to be an address that resolves inside the compose network.
      #   Auth serves plain HTTP on :8081 — nginx is the TLS edge, Auth itself has
      #   no TLS listener and never had one on :8443 — and JWKS is on :8081 only
      #   (:8080 and :8082 answer 404).
      #
      #   AUTH_ISSUER and AUTH_AUDIENCE are STRING-COMPARED against the `iss` and
      #   `aud` claims. They are never dialled, so they must be the exact public
      #   strings Auth stamps. The issuer is Auth's APP_PUBLIC_HOSTNAME; the
      #   audience is the `apis.identifier` core registered for itself
      #   (CORE_API_AUDIENCE), which is a URL-shaped identifier, not an endpoint.
      #
      # Plaintext http on the JWKS hop is DEVELOPMENT ONLY, for the same reason as
      # secret above: no local CA in this image, nginx holds the TLS edge.
      # Production must use the https public JWKS URL or an mTLS mesh.
      AUTH_JWKS_URL: "http://maintainerd-auth:8081/.well-known/jwks.json"
      AUTH_ISSUER: "https://identity-api.auth.maintainerd.local"
      AUTH_AUDIENCE: "https://core.maintainerd.local"
      # BOTH dialled AND compared, which is why it is the public form even though
      # it is a URL: core POSTs here, and it also signs this exact string as the
      # `aud` of its private_key_jwt client assertion. Auth accepts an assertion
      # audience only from its own APP_PUBLIC_HOSTNAME set, so an internal address
      # would connect and then have every mint refused. Resolves on the compose
      # network via the nginx alias.
      AUTH_TOKEN_URL: "https://identity-api.auth.maintainerd.local/api/v1/oauth/token"
      # Which makes the local CA a requirement: that hop is https through nginx,
      # and this distroless image's trust store has no local CA. Narrowing trust
      # to only this CA is safe here because every outbound origin in this stack is
      # local; a deployment that also calls the public internet must instead ADD
      # the CA to the system bundle.
      SSL_CERT_FILE: /etc/maintainerd/ca/maintainerd-local-ca.crt
      # Core's outbound origin for secret's REST API. http is permitted only
      # because APP_ENV=development; the config refuses a non-https origin
      # anywhere else, since every request core sends here carries a credential.
      SECRET_BASE_URL: "http://maintainerd-secret:8092"
      # --- core drives secret's gRPC SetupService --------------------------
      # The controlled-mode counterpart to AUTH_SETUP_ADDR above. Empty means
      # core does not drive secret's setup at all and an operator runs secret's
      # own REST wizard (standalone). The launcher sets the token under the
      # all / all-observed profiles, alongside auth's.
      SECRET_SETUP_ADDR: "maintainerd-secret:9092"
      SECRET_SETUP_BOOTSTRAP_TOKEN: ${MAINTAINERD_SECRET_SETUP_TOKEN:-}
    volumes:
      # gRPC mTLS material (same CA as Auth). Read-only. Generated by ./maintainerd setup.
      - ./.certs/grpc:/etc/maintainerd/grpc-certs:ro
      # The local CA, for the https hop to Auth's token endpoint (SSL_CERT_FILE).
      - ./.certs:/etc/maintainerd/ca:ro
    ports:
      - "9080:8080"
      - "9081:8081"
    restart: unless-stopped

  maintainerd-agent:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd-agent
        CMD_PATH: cmd/agentd
    profiles: ["maintainerd", "all", "all-observed"]
    depends_on:
      - maintainerd-core
    # Root + the host socket: the docker runtime driver is compiled into the
    # agent (dev convenience; production hosts scope this properly).
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - maintainerd-agent-state:/var/lib/maintainerd-agent
    environment:
      APP_ENV: development
      CORE_ADDR: "maintainerd-core:8081"
      AGENT_NAME: agent-1
      GRPC_PORT: "9091"
      HTTP_PORT: "8091"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  go-mod-cache:
  go-build-cache:
  console-node-modules:
  # The agent's static cache — system-tier desired state survives restarts so
  # the agent can supervise system services with core down.
  maintainerd-agent-state:
  identity-node-modules:
  core-console-node-modules:
  secret-console-node-modules:
  prometheus-data:
  grafana-data:

networks:
  default:
    driver: bridge
  signoz-net:
    name: signoz-net
