# =============================================================================
# maintainerd — Development Environment
# LOCAL DEVELOPMENT ONLY — not production-hardened.
# =============================================================================
# Profiles:
#   auth    All auth services (backend + frontends + databases + nginx)
#   auth-observed  Auth + observability (Prometheus + Grafana + SigNoz)
#   all            Everything (currently equivalent to auth-observed)
#
# Usage:
#   ./maintainerd up --profile=auth -d
#   ./maintainerd up --profile=auth-observed -d
#   ./maintainerd down
# =============================================================================

# Pull in SigNoz (OTLP collector, ClickHouse, UI). SigNoz listens on host ports
# 4317/4318 (gRPC/HTTP); its UI is at http://localhost:8080.
# Vendored from github.com/SigNoz/signoz (deploy/) at v0.128.0.
include:
  - deploy/signoz/docker/docker-compose.yaml

services:
  # The included SigNoz services are unprofiled upstream. Assign them here so
  # auth stays lightweight while auth-observed and all remain complete.
  init-clickhouse:
    profiles: ["auth-observed", "all"]

  zookeeper-1:
    profiles: ["auth-observed", "all"]

  clickhouse:
    profiles: ["auth-observed", "all"]

  signoz:
    profiles: ["auth-observed", "all"]
    ports: !reset []
    networks:
      - default
      - signoz-net

  otel-collector:
    profiles: ["auth-observed", "all"]
    networks:
      - default
      - signoz-net

  signoz-telemetrystore-migrator:
    profiles: ["auth-observed", "all"]

  # ── Infrastructure (shared across profiles) ─────────────────────────────────

  postgres-db:
    image: postgres:17
    container_name: postgres-db
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: maintainerd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "devuser", "-d", "maintainerd"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-db:
    image: redis:7
    container_name: redis-db
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "Pass123"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Pass123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: Pass123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────

  maintainerd-auth:
    # Single all-in-one image: Go backend (control :8080 / data :8081) + admin
    # console (:3000) + hosted identity (:3001), all built from the consolidated
    # maintainerd-auth repo (web/console + web/identity). nginx below routes the
    # public hostnames to these ports on the compose network.
    build:
      context: ../maintainerd-auth
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: m9d-auth-dev
    container_name: m9d-auth-dev
    profiles: ["auth", "auth-observed", "all"]
    # gRPC (mTLS) is published for host tooling such as grpcurl. The HTTP APIs
    # and SPAs stay on the compose network behind nginx.
    ports:
      - "50051:50051"
    env_file:
      # Backend config + secrets, generated by ./maintainerd setup.
      - ../maintainerd-auth/.env
    volumes:
      # gRPC mTLS material (server cert/key + client CA). Read-only; generated by
      # ./maintainerd setup. Paths match GRPC_*_FILE in the auth .env.
      - ./.certs/grpc:/etc/maintainerd/grpc-certs:ro
    environment:
      # The launcher enables OTLP only when an observability profile is active
      # (overrides the value in .env). Avoids reconnect loops in the auth stack.
      - OTEL_ENABLED=${MAINTAINERD_OTEL_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # ── nginx (API gateway) ─────────────────────────────────────────────────────

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    profiles: ["auth", "auth-observed", "all"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - console-api.auth.maintainerd.local
          - identity-api.auth.maintainerd.local
          - console.auth.maintainerd.local
          - identity.auth.maintainerd.local
          - rabbitmq.auth.maintainerd.local
          - prometheus.auth.maintainerd.local
          - grafana.auth.maintainerd.local
          - signoz.auth.maintainerd.local
    depends_on:
      maintainerd-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # The console and identity SPAs are now built into the single maintainerd-auth
  # image above (web/console + web/identity), served on :3000 and :3001. There
  # are no separate frontend containers anymore.

  # ── Observability (auth-observed and all profiles) ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["auth-observed", "all"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    profiles: ["auth-observed", "all"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_ROOT_URL=https://grafana.auth.maintainerd.local
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    driver: bridge
  signoz-net:
    name: signoz-net
