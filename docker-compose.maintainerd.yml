# The maintainerd core stack — everything under the "all" profile so
#   docker compose -f docker-compose.maintainerd.yml --profile all up --build
# brings up the whole thing (Core + Agent + Docker + Secret + Postgres) and the
# control loop turns. Built from the parent context via go.work (see build/Dockerfile).
name: maintainerd

services:
  m9d-core-db:
    image: postgres:16-alpine
    profiles: ["all"]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: corepass
      POSTGRES_DB: core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 2s
      timeout: 3s
      retries: 20

  m9d-secret:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd-secret
        CMD_PATH: cmd/secretd
    profiles: ["all"]
    environment:
      APP_ENV: development
      SECRET_ROOT_KEY: "0123456789abcdef0123456789abcdef"
      SETUP_BOOTSTRAP_TOKEN: devtoken
      GRPC_PORT: "9092"
      HTTP_PORT: "8092"

  m9d-docker:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd-docker
        CMD_PATH: cmd/dockerd
    profiles: ["all"]
    # Runs as root to read the mounted host Docker socket (dev convenience).
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: development
      GRPC_PORT: "9090"
      HTTP_PORT: "8090"

  m9d-core:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd
        CMD_PATH: cmd/server
    profiles: ["all"]
    depends_on:
      m9d-core-db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: m9d-core-db
      DB_PORT: "5432"
      DB_USER: core
      DB_PASSWORD: corepass
      DB_NAME: core
      DB_SSLMODE: disable
      APP_PUBLIC_HOSTNAME: http://localhost
      APP_PRIVATE_HOSTNAME: http://localhost
      HTTP_PORT: "8080"
      GRPC_PORT: "8081"
    ports:
      - "8080:8080"
      - "8081:8081"

  m9d-agent:
    build:
      context: ..
      dockerfile: maintainerd-dev/build/Dockerfile
      args:
        SERVICE: maintainerd-agent
        CMD_PATH: cmd/agentd
    profiles: ["all"]
    depends_on:
      - m9d-core
      - m9d-docker
    environment:
      APP_ENV: development
      RUNTIME_ADDR: "m9d-docker:9090"
      CORE_ADDR: "m9d-core:8081"
      AGENT_NAME: agent-1
      GRPC_PORT: "9091"
      HTTP_PORT: "8091"
